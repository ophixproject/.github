name: Feature Request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature suggestions are welcome. This project follows a small set of hard architectural rules (Independence, air-gap compatibility, pip composability, no client-side credential persistence — see CONTRIBUTING.md) — a request that conflicts with one of these is unlikely to be accepted regardless of merit, so it's worth checking there first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
