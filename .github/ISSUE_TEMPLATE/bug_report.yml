name: Bug Report
description: Report a reproducible problem in the code
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug — community bug reports are genuinely welcome and help everyone using Ophix.

        This is free, MIT-licensed software provided with no warranty — there's no guaranteed fix or response time for issues filed here. If you need help *using* Ophix rather than reporting a defect, please use [paid support](https://ophix.io/services/) instead of filing an issue.
  - type: input
    id: package
    attributes:
      label: Package and version
      description: Which Ophix package, and what version?
      placeholder: "e.g. ophix-creds 2026.08.30.01"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Django version, database engine — whatever's relevant.
    validations:
      required: false
